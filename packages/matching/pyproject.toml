[project]
name = "roof-pv-matching"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["roof-pv-registry", "shapely>=2,<3", "pyproj>=3.7,<4"]

[tool.uv.sources]
roof-pv-registry = { workspace = true }

[project.scripts]
roof-pv-match = "roof_pv_matching.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roof_pv_matching"]
