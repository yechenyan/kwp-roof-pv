[project]
name = "roof-pv-registry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["requests>=2.32,<3"]

[project.scripts]
roof-pv-registry = "roof_pv_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roof_pv_registry"]
