[project]
name = "roof-pv-model"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "rasterio>=1.4,<2", "scipy>=1.14,<2", "shapely>=2,<3", "pyproj>=3.7,<4", "pillow>=11,<14", "geopandas>=1,<2"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "torchvision>=0.21,<0.31", "segmentation-models-pytorch>=0.5,<0.7"]

[project.scripts]
roof-pv = "roof_pv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roof_pv"]
